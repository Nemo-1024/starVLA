run_id: starvla
run_root_dir: results/Checkpoints
seed: 42
trackers: [wandb]
wandb_entity: rleai
wandb_project: finetune-LIBERO
is_debug: false


framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /mnt/project_rlinf/jlchen/weights/Qwen3-VL-2B-Instruct
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024     
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
    action_horizon: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null


datasets:
  vla_data:
    data_root_dir: /mnt/project_rlinf/jlchen/datasets
    data_mix: libero
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    video_backend: pyav


trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze:
    freeze_vision_backbone: false
    freeze_llm_backbone: false
    freeze_last_llm_layer: false
    freeze_embedding: false
    unfreeze_vision_merger: false
    unfreeze_llm_last_n_layers: null
    unfreeze_lam_decoder: false
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
