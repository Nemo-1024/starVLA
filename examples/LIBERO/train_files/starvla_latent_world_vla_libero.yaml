run_id: latent_world_vla_libero
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: null
wandb_project: finetune-LIBERO
is_debug: false

framework:
  name: LatentWorldVLAIndependent
  qwenvl:
    base_vlm: /mnt/project_rlinf/jlchen/weights/Qwen3-VL-2B-Instruct
  latent_world:
    lam_ckpt_path: "/mnt/project_rlinf/jlchen/code/starVLA/latent_action_model/logs/dino_base_ae_bigwin/version_1/checkpoints/epoch=2.ckpt"
    lam_yaml_path: "/mnt/project_rlinf/jlchen/code/starVLA/latent_action_model/logs/dino_base_ae_bigwin/version_1/dino_base_ae.yaml"
    num_action_queries: 8
    perceptual_weight: 0.1
    freeze_vision_backbone: true
    freeze_llm_backbone: true
    freeze_last_llm_layer: true
    freeze_embedding: true
    unfreeze_vision_merger: true
    unfreeze_llm_last_n_layers: 4
    unfreeze_lam_decoder: true
    latent_action_placeholder_token: "<ACT_PH>"
    future_prediction: true
    enable_wrist_view: false
    enable_loss_distill: true
    lam_encoder_distill_weight: 0.1
    flow_cfg:
      action_dim: 7
      window_size: 10
      state_dim: 8
      vlm_dim: 2048
      vision_dim: 768
      num_vision_tokens: 256
      hidden_dim: 768
      num_layers: 12
      interleave_self_attention: true
      use_alternate_vldit: true
      attend_text_every_n_blocks: 2
      state_dropout_prob: 0.0
      cfg_drop_prob: 0.0
      cfg_guidance_scale: 1.0
      num_timestep_buckets: 1000
      noise_beta_alpha: 1.5
      noise_beta_beta: 1.0
      noise_s: 0.999

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/project_rlinf/jlchen/datasets
    data_mix: libero
    action_type: delta_qpos
    image_resolution: 256
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: pyav
    include_state: true
    image_aug: true
    shuffle_buffer_size: 20000
    use_history_frame: false
    debug_repeat_batch: false
    num_frames: 2
    window_size: 10

trainer:
  max_train_steps: 80000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
  is_resume: false
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
